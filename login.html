<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - KMUTNB</title>
    <link rel="stylesheet" href="css/loginstyle.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="header-left">
                <img src="image/logo_kmutnb.jpg" alt="KMUTNB Logo" class="header-logo">
                <div class="header-text-container">
                    <p class="header-text">มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ</p>
                    <p class="header-text">King Mongkut's University of Technology North Bangkok</p>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="login-box">
            <h1>Sign in</h1>
            
            <form action="index.html" method="GET">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter Username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password" required>
                </div>

                <button type="submit" class="btn-signin">Sign in &gt;</button>
                
                <div class="login-links">
                    <a href="">Register</a>
                    <a href="">Forgot password?</a>
                </div>
            </form>
        </div>
    </main>


    <footer>
        <!-- <div class="footer-content">
        </div> -->
    </footer>

</body>
</html>
